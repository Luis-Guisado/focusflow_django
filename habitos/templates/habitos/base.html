<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}FocusFlow{% endblock %}</title>
    <style>
        * {box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f7fb; color: #1E3A5F; }
        header { background: linear-gradient(135deg, #1E3A5F, #2E5C8A); color: #fff; padding: 20px 40px; }
        header h1 { margin: 0; font-size: 26px; }
        header p { margin: 4px 0 0; font-size: 14px; opacity: 0.9; }
        main { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card { background: #fff; border-radius: 10px; padding: 24px; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); }
        table { width: 100%; border-collapse: collapse; }
        th { background: #2E5C8A; color: #fff; text-align: left; padding: 10px; }
        td { padding: 10px; border-bottom: 1px solid #e3e8ef; }
        .btn { display: inline-block; padding: 8px 16px; border-radius: 6px; text-decoration: none; color: #fff; border: none; cursor: pointer; font-size: 14px; background: #4A90E2 }
        .btn-verde { background: #42EC83; color: #1E3A5F; }
        .btn-rojo { background: #E63946; }
        .acciones { margin-bottom: 16px; }
        label { display: block; margin-top: 14px; font-weight: bold; }
        input[type=text], input[type=number], textarea, select {width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #b8c4d6; border-radius: 6px; font-family: Arial, sans-serif; }
        .errorlist { color: #E63946; list-style: none; padding: 0; margin: 4px 0; font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <h1>FocusFlow</h1>
        <p>Organiza tu tiempo, alcanza tus metas.</p>
    </header>
    <main>
        {% block contenido %}{% endblock %}
    </main>
</body>
</html>
